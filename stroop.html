<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task (Resilient Fullscreen)</title>
    
    <!-- jsPsych 7.3.4 核心ライブラリ -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <!-- プラグイン: キーボード反応、ボタン反応（開始用） -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>

    <style>
        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 刺激：漢字が切れないようline-heightを調整 */
        .stimulus {
            font-size: 60px;
            font-weight: bold;
            line-height: 1.5;
            text-align: center;
            user-select: none;
        }

        /* 教示：読みやすさとレスポンシブ対応 */
        .instructions {
            font-size: 24px;
            line-height: 1.8;
            text-align: left;
            max-width: 800px;
            padding: 20px;
            word-wrap: break-word;
        }

        .fixation {
            font-size: 60px;
            line-height: 1;
        }

        kbd {
            background-color: #f0f0f0;
            border-radius: 4px;
            border: 1px solid #ccc;
            padding: 2px 8px;
            font-weight: bold;
            font-family: monospace;
        }

        /* カスタムボタンのスタイル */
        .start-btn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .start-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                // フルスクリーン解除を試みる
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                jsPsych.data.displayData('csv');
            }
        });

        const stroop_stimuli = [
            { word: "赤", color: "red", condition: "congruent", correct_key: "r" },
            { word: "青", color: "blue", condition: "congruent", correct_key: "b" },
            { word: "緑", color: "green", condition: "congruent", correct_key: "g" },
            { word: "赤", color: "blue", condition: "incongruent", correct_key: "b" },
            { word: "赤", color: "green", condition: "incongruent", correct_key: "g" },
            { word: "青", color: "red", condition: "incongruent", correct_key: "r" },
            { word: "青", color: "green", condition: "incongruent", correct_key: "g" },
            { word: "緑", color: "red", condition: "incongruent", correct_key: "r" },
            { word: "緑", color: "blue", condition: "incongruent", correct_key: "b" }
        ];

        // 10試行をランダムに抽出
        const trials_to_run = jsPsych.randomization.sampleWithReplacement(stroop_stimuli, 10);

        let timeline = [];

        // Permissions Policyによるエラーを回避するため、try-catchで囲んだカスタム起動画面
        const enter_fullscreen_safe = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="instructions" style="text-align:center;">
                    <p>実験を開始します。</p>
                    <p style="font-size: 16px; color: #666;">（可能な場合は自動的に全画面表示に切り替わります）</p>
                </div>
            `,
            choices: ['実験を開始する'],
            button_html: '<button class="start-btn">%choice%</button>',
            on_finish: function() {
                const element = document.documentElement;
                // ブラウザの制限を確認しながらフルスクリーンを要求
                try {
                    if (element.requestFullscreen) {
                        element.requestFullscreen().catch(err => {
                            console.warn("Fullscreen denied by policy: ", err.message);
                        });
                    }
                } catch (e) {
                    console.warn("Fullscreen API not available or blocked.");
                }
            }
        };
        timeline.push(enter_fullscreen_safe);

        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instructions">
                    <p>提示される文字の<b>「色」</b>をキーボードで答えてください。</p>
                    <p>文字の意味（読み）に惑わされないように注意してください。</p>
                    <hr>
                    <p>・赤色の文字なら <kbd>r</kbd> キー</p>
                    <p>・青色の文字なら <kbd>b</kbd> キー</p>
                    <p>・緑色の文字なら <kbd>g</kbd> キー</p>
                    <br>
                    <p>準備ができたら <b>スペースキー</b> を押して開始します。</p>
                </div>
            `,
            choices: [' '],
            post_trial_gap: 500
        };
        timeline.push(instructions);

        for (let i = 0; i < trials_to_run.length; i++) {
            const trial_data = trials_to_run[i];

            // 注視点
            const fixation = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div class="fixation">+</div>',
                choices: "NO_KEYS",
                trial_duration: 500,
                data: { task: 'fixation' }
            };

            // 刺激提示
            const stimulus_trial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `<div class="stimulus" style="color: ${trial_data.color};">${trial_data.word}</div>`,
                choices: ['r', 'b', 'g'],
                // キー入力があるまで無限に待機 (仕様書より)
                data: {
                    task: 'response',
                    word: trial_data.word,
                    color: trial_data.color,
                    condition: trial_data.condition,
                    correct_response: trial_data.correct_key
                },
                on_finish: function(data) {
                    data.correct = (data.response == data.correct_response);
                }
            };

            // 試行間隔 (ITI)
            const iti = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '',
                choices: "NO_KEYS",
                trial_duration: 1000,
                data: { task: 'iti' }
            };

            timeline.push(fixation, stimulus_trial, iti);
        }

        window.onload = function() {
            jsPsych.run(timeline);
        };
    </script>
</body>
</html>
