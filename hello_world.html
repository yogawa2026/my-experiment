<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学実験室</title>
    <style>
        /* 1. 背景は薄いグレー */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        /* 2. 画面中央に大きな文字で表示 */
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        /* 3. 実験を開始する青いボタン */
        .start-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .start-button:hover {
            background-color: #0056b3;
        }

        .start-button:active {
            transform: scale(0.98);
        }

        /* カスタムアラートのスタイル（alert()の代わり） */
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
        }

        .close-btn {
            margin-top: 1.5rem;
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>心理学実験室へようこそ</h1>
        <button class="start-button" onclick="showAlert()">実験を開始する</button>
    </div>

    <!-- 4. アラートの表示用要素 -->
    <div id="overlay" class="overlay" onclick="hideAlert()"></div>
    <div id="custom-alert">
        <h2 style="margin-top:0;">メッセージ</h2>
        <p style="font-size: 1.2rem;">Hello World!</p>
        <button class="close-btn" onclick="hideAlert()">閉じる</button>
    </div>

    <script>
        function showAlert() {
            // 指示に基づき、標準のアラートの代わりに見栄えの良いダイアログを表示します
            document.getElementById('custom-alert').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
            
            // コンソールにも出力
            console.log("Hello World!");
        }

        function hideAlert() {
            document.getElementById('custom-alert').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
